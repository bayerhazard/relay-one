name: CI (Test & Lint)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --no-deps

  frontend:
    name: Frontend (Svelte/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci --silent

      - name: typecheck (tsc)
        run: npm run check

      - name: vitest (unit + coverage gate)
        run: npm run test:run

      - name: build (adapter-static)
        run: npm run build

  # The browser tour (CI ABGLEICH Etappe 7): every page in light and dark, on
  # desktop and phone, against the real server — once with an empty data
  # dir, once filled from the test servers (web/e2e/testserver/).
  oberflaeche:
    name: Oberfläche (Rundgang)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tour-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build server
        run: cargo build --locked -p relay-server

      - name: build web
        working-directory: web
        run: npm ci --silent && npm run build

      - name: start server
        run: |
          mkdir -p "$RUNNER_TEMP/relay-data"
          RELAY_DATA_DIR="$RUNNER_TEMP/relay-data" \
          RELAY_WEB_DIR="$GITHUB_WORKSPACE/web/build" \
          RELAY_BIND=127.0.0.1:3799 \
          RELAY_OLARES_FIRSTNAME=Erika RELAY_OLARES_LASTNAME=Muster \
            nohup target/debug/relay-server > "$RUNNER_TEMP/relay-server.log" 2>&1 &

      - name: install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: tour
        working-directory: web
        run: npm run e2e

      # The GreenMail jar and Radicale's venv, so the tour does not depend on
      # Maven Central answering on every run.
      - name: Cache test servers
        uses: actions/cache@v4
        with:
          path: web/e2e/testserver/.lauf
          key: testserver-${{ runner.os }}-${{ hashFiles('web/e2e/testserver/starten.sh') }}

      - name: test servers with dummy data
        run: |
          web/e2e/testserver/starten.sh
          mkdir -p "$RUNNER_TEMP/relay-daten"
          RELAY_DATA_DIR="$RUNNER_TEMP/relay-daten" \
          RELAY_WEB_DIR="$GITHUB_WORKSPACE/web/build" \
          RELAY_BIND=127.0.0.1:3800 \
          RELAY_OLARES_FIRSTNAME=Erika RELAY_OLARES_LASTNAME=Muster \
            nohup target/debug/relay-server > "$RUNNER_TEMP/relay-daten.log" 2>&1 &
          python3 web/e2e/testserver/befuellen.py --relay http://127.0.0.1:3800

      - name: tour with data
        working-directory: web
        env:
          RELAY_DATEN: "1"
          RELAY_URL: http://127.0.0.1:3800
        run: npm run e2e

      - name: upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rundgang
          path: |
            web/e2e-bericht/
            web/test-results/
            ${{ runner.temp }}/relay-server.log
            ${{ runner.temp }}/relay-daten.log
            web/e2e/testserver/.lauf/*.log
          retention-days: 7
