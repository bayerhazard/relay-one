<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#051729" media="(prefers-color-scheme: dark)" />
    <script>
      // Dark class before first paint (CI RL-T2). Mirrors lib/stores/appearance.ts.
      (function () {
        var a = "system";
        try {
          a = localStorage.getItem("relay_appearance") || "";
          if (!a) {
            var legacy = localStorage.getItem("relay_theme");
            a = legacy === "dark" ? "dark" : legacy === "blue" ? "light" : "system";
          }
        } catch (e) {}
        var dark = a === "dark" || (a === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dunkel");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Relay" />
    <link rel="icon" href="%sveltekit.assets%/icon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
