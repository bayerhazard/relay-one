[package]
name = "relay-server"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["macros","multipart", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }

lettre = { version = "0.11", default-features = false, features = [
    "tokio1", "tokio1-rustls-tls", "builder",
    "smtp-transport", "pool"
] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
imap-proto = "0.16"
mail-parser = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "multipart", "rustls-tls"] }
quick-xml = "0.37"
async-stream = "0.3"
futures = "0.3"
regex = "1.10"
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"
once_cell = "1.20"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
digest_auth = "0.3"
strsim = "0.11"
bytes = "1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
