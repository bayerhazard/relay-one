workloads:
  relay:
    replicaCount: 1

image:
  repository: ghcr.io/bayerhazard/relay-one
  tag: 26.9.175
  pullPolicy: IfNotPresent

# Pin the pod to the main node: the relay data volume is hostPath-backed
# (userspace appData), and only the "olares" node holds the real database.
# Without this the scheduler can place the pod on "olares-worker", which has
# a stale/corrupt copy -> "database disk image is malformed" crash loop.
nodeSelector:
  kubernetes.io/hostname: olares

storage:
  mountPath: /data/Relay
  size: 100Gi

# Insilo-Meeting-Summaries: read-only Cross-App-Drop (Olares appCommon).
# Insilo schreibt nach <appCommon>/insilo-meetings, Relay pollt das
# Verzeichnis und zeigt die Meetings im eigenen „Meetings"-Bereich.
insilo:
  enabled: true
  mountPath: /data/insilo
  scanIntervalSec: 600

# Insilo-Ideen (Sprachmemos vom Typ "Idee"): sie liegen im selben geteilten
# Drop wie die Meetings (appCommon). Relay filtert sie dort heraus, verarbeitet
# jede Idee zu einer Aufgabe und listet sie NICHT mehr im Meetings-Bereich.
insiloIdeas:
  enabled: true
  scanIntervalSec: 120
  ideaPrefix: "Idea"

# Trusted host suffix for the relay_key_guard: browser traffic arriving with
# a Host header ending in this suffix bypasses the X-Relay-Key requirement
# (protected by the entrance authLevel instead). Leave empty to require the
# key for ALL requests (fail-closed). Set to your entrance domain, e.g.
# "olares.de" for Olares or "example.com" for other deployments.
trustedHostSuffix: ""

# Defaults for the Olares env mapping (declared in OlaresManifest envs[]).
# Olares overrides these at install with the user's values; empty means the
# variable is unset and Relay falls back to manual setup.
olaresEnv:
  RELAY_OLARES_EMAIL: ""
  RELAY_OLARES_USERNAME: ""
  RELAY_OLARES_TIMEZONE: ""
  RELAY_OLARES_FIRSTNAME: ""
  RELAY_OLARES_LASTNAME: ""
  RELAY_OLARES_COMPANY_NAME: ""
  RELAY_OLARES_COMPANY_ADDRESS: ""
  RELAY_OLARES_COMPANY_PHONE: ""
  RELAY_OLARES_COMPANY_WEBSITE: ""
  RELAY_OLARES_COMPANY_EMAIL: ""
  RELAY_OLARES_COMPANY_VAT_ID: ""
  RELAY_OLARES_COMPANY_REGISTER: ""
  RELAY_OLARES_MAIL_ACCOUNT_NAME: ""
  RELAY_OLARES_MAIL_SIGNATURE: ""
  RELAY_OLARES_IMAP_SERVER: ""
  RELAY_OLARES_IMAP_PORT: ""
  RELAY_OLARES_IMAP_USERNAME: ""
  RELAY_OLARES_IMAP_PASSWORD: ""
  RELAY_OLARES_IMAP_SSL: ""
  RELAY_OLARES_SMTP_SERVER: ""
  RELAY_OLARES_SMTP_PORT: ""
  RELAY_OLARES_SMTP_USERNAME: ""
  RELAY_OLARES_SMTP_PASSWORD: ""
  RELAY_OLARES_SMTP_FROM_ADDRESS: ""
  RELAY_OLARES_SMTP_SECURITY_PROTOCOLS: ""
  RELAY_OLARES_SMTP_USE_TLS: ""
  RELAY_OLARES_SMTP_USE_SSL: ""
  RELAY_OLARES_SMTP_ENABLED: ""
