workloads:
  relay:
    replicaCount: 1

image:
  repository: ghcr.io/bayerhazard/relay-one
  tag: 26.9.128
  pullPolicy: IfNotPresent

# Pin the pod to the main node: the relay data volume is hostPath-backed
# (userspace appData), and only the "olares" node holds the real database.
# Without this the scheduler can place the pod on "olares-worker", which has
# a stale/corrupt copy -> "database disk image is malformed" crash loop.
nodeSelector:
  kubernetes.io/hostname: olares

storage:
  mountPath: /data/Relay
  size: 100Gi

# Trusted host suffix for the relay_key_guard: browser traffic arriving with
# a Host header ending in this suffix bypasses the X-Relay-Key requirement
# (protected by the entrance authLevel instead). Leave empty to require the
# key for ALL requests (fail-closed). Set to your entrance domain, e.g.
# "olares.de" for Olares or "example.com" for other deployments.
trustedHostSuffix: ""
