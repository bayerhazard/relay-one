  # them, they resolve to empty and Relay simply offers manual setup. Custom
  # vars (IMAP_*, FIRSTNAME, COMPANY_*, MAIL_*) live in Settings → Advanced →
  # System environment variables and get the OLARES_USER_ prefix automatically.
