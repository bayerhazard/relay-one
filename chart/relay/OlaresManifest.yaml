olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.08.101
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: internal
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.08.101
  upgradeDescription: |
    v26.08.101: Chart-Re-Sync (Version-Bump erzwingt Olares-Chart-Re-Fetch; Image bleibt 26.08.100 mit UI-Verfeinerung: Gold-Schild-Logo, Versionszeile entfernt, Modul-Buttons icon-only). Built for Olares 1.12.6.
    v26.08.100: UI-Verfeinerung — (1) Konten-Pill in der Sidebar durch Gold-Schild-Logo ersetzt (Klick fuehrt zu Einstellungen). (2) Versionszeile "AImighty Relay 3.0" in der Sidebar entfernt. (3) Modul-Buttons (Kalender/Kontakte/Aufgaben) zeigen nur noch Icons ohne Text (Tooltip bleibt). Built for Olares 1.12.6.
    v26.09.99: FIX AI-Gate (Live-Verifizierung mit Experte) — (1) max_tokens der KI-Handler erhoeht (Smart Scheduling/Meeting-Prep/Morgen-Digest/Assistent/Followups), damit laengere JSON-Antworten nicht mehr abgeschnitten und als leer geparst werden. (2) Globaler Assistent gibt Datums-/Zeitfelder im Action-Payload jetzt als RFC3339-UTC-Timestamp aus (vorher relativer Text wie "morgen 14:00"), damit Aktionen direkt ausgefuehrt werden koennen; Prompt bekommt Referenzdatum zur Zeitaufloesung. Alle 6 KI-Features live getestet (Followups, NL-Erstellung, Smart Scheduling, Meeting-Prep, Morgen-Digest, Assistent). Built for Olares 1.12.6.
    v26.09.98: NEU AI-First (Phase 4) — (1) NL-Erstellung: Freitext-Composer in Kalender und Aufgaben ("Morgen 14 Uhr Kaffee mit Anna") legt per KI Termin oder Aufgabe an (Intent-Erkennung). (2) Smart Scheduling: Button im Termin-Editor laesst die KI unter Beruecksichtigung von Konflikten/Constraints die besten Zeitfenster vorschlagen. (3) Meeting-Prep: Button im Termin-Editor erstellt eine KI-Vorbereitung (Teilnehmer, Agenda, Kontext aus Kontakten + Mails). (4) Morgen-Digest: Button in der Tagesansicht erzeugt einen KI-Ueberblick (Prioritaeten, Follow-ups) fuer die naechsten Tage. (5) Globaler Assistent (Centerpiece): jederzeit erreichbarer Drawer (schwebender Button) mit Chat-UI; der Assistent antwortet und kann Aktionen ausloesen (Termin anlegen, Aufgabe anlegen, Mail suchen). Built for Olares 1.12.6.
    v26.09.97: NEU Kontakte + Aufgaben + KI-Followups (Phase 3) — (1) Kontakte: CardDAV-Anbindung mit vollem CRUD (anlegen/bearbeiten/loeschen, VCard-Roundtrip), eigene Kontakte-Seite in der Sidebar; Auto-Enrichment: Absender/Empfaenger eingehender Mails werden automatisch als Kontakte angelegt/ergaenzt (source=mail). (2) Aufgaben: CalDAV-VTODO-Sync (fetch + local cache), eigene Aufgaben-Seite mit Filtern (Offen/Erledigt/Alle), Erledigt-Toggle, Fälligkeitsdatum, Priorität, CalDAV-Sync-Button. (3) KI-Followups: Button in der Mail-Detailansicht lasst die KI konkrete Follow-up-Aktionen aus der Mail ableiten (max. 5, mit Grund + Fälligkeitsdatum); jede Aktion laesst sich per Klick direkt als Aufgabe anlegen. Built for Olares 1.12.6.
    v26.09.96: NEU Mail↔Kalender (Phase 2) — iMIP-Termin-Einladungen: eingehende ICS-Anhänge (METHOD:REQUEST/REPLY/CANCEL) werden beim Mail-Sync erkannt und in einer Einladungs-Queue in der Kalender-Sidebar abgelegt (Annehmen/Ablehnen sendet eine METHOD:REPLY-Antwort an den Organisator); eigene Termine lassen sich per Button mit ICS-Anhang an Teilnehmer einladen. Konflikt-Erkennung: der Termin-Editor warnt bei Überschneidungen und zeigt per KI-Vorschlag 3 konfliktfreie Alternativen. Zeit-Erkennung: freie Texteingabe (z.B. „Mittwoch 14 Uhr") füllt Beginn/Ende/Titel per KI. KI-RSVP-Entwurf: generiert eine kurze Antwort auf eine Einladung. Built for Olares 1.12.6.
    v26.09.95: NEU Kalender (CalDAV/CardDAV) — Phase 0+1. Volle Kalender-App: CalDAV-Anbindung (z.B. Radicale), 3-Pane-UI (Mini-Monat, Kalender-Liste, Monats-/Wochen-/Tagesansicht, Detail-Pane), wiederholende Termine (RRULE), Zeitzonen, Multi-Kalender, deutsche Feiertage, ICS-Import/Export, Erinnerungen; Settings-Tab fuer CalDAV-Login. Built for Olares 1.12.6.
    v26.09.94: FIX AI-Code-Review: (1) Phishing-Erkennung aktiv — eingehende Mails werden jetzt beim Sync automatisch auf Betrugsmuster geprueft (Dringlichkeits-Sprache, Link/URL-Mismatch, versteckte Links, verdaechtige TLDs, Zugangsdaten-Bitten, URL-Shortener); Warnhinweis "Phishing-Verdacht" erscheint direkt in der Mail-Liste (schweller >0.6) — lief vorher nie, da der Score nie berechnet wurde. (2) Lernschleife repariert — der individuelle Schreibstil pro Empfaenger (Style-Fingerprint) wird jetzt korrekt synthetisiert und beim Verfassen/Beantworten in den KI-Prompt eingespeist (vorher Account-ID-Mismatch → Fingerprint war nie verfuegbar). (3) Tonfall-Profile-Export verdrahtet (POST /ai/tone-profiles/export). (4) Weihnachts-Gruss-Anlass im Prompt korrigiert. Built for Olares 1.12.6.
    v26.09.93: NEU Mails zwischen Konten verschieben — Drag & Drop auf den Kontonamen (INBOX) eines anderen Kontos funktioniert jetzt (vorher ohne Reaktion), ebenso auf gleichnamige Unterordner anderer Konten; Raw-IMAP-Pfade werden fuer Quelle UND Ziel korrekt aufgeloest (verschachtelte/nicht-ASCII-Ordner). Der Verschieben-Button bietet jetzt Ziele aller Konten gruppiert nach Konto (Mehrfachauswahl wird nacheinander verschoben), das Nachrichten-Kontextmenü hat einen Verschieben-Eintrag. PERF Sofortiger Ordnerwechsel — gecachte Ordner erscheinen sofort, die Aktualisierung laeuft unsichtbar im Hintergrund (kein Skeleton/Spinner mehr bei bereits sichtbarer Liste); Server-Cache-TTL 5s→30s mit expliziter Invalidierung nach Move/Delete/Flag/Gelesen; Client-Freshness-Fenster 15s gegen Redundanzt-Fetches beim schnellen Ordnerwechsel. Built for Olares 1.12.6.
    v26.09.92: ZWEISPRACHIG — Relay ist jetzt komplett auf Deutsch UND Englisch umstellbar (Buttons, Labels, Menues, Dialoge, Zustandsmeldungen). Der Splash-Screen startet auf Deutsch mit kleinem DE/EN-Toggle; unter Einstellungen → Allgemein → Sprache laesst sich die Sprache jederzeit wechseln (wird im Browser gespeichert). FIX X-Relay-Key-Fehler beim Konto-Verbinden — der API-Key-Guard (RELAY_API_KEY/RELAY_TRUSTED_HOST_SUFFIX) ist deaktiviert; der Zugriffsschutz liegt auf dem Olares-Entrance (authLevel: internal, Zugriff via Olares-VPN unterwegs). Die haeufigsten Server-Fehlermeldungen (Konto-Verbindung, IMAP/SMTP) werden sprachabhaengig angezeigt. Built for Olares 1.12.6.
    v26.09.91: FIX Mails nach Kaltstart nicht oeffenbar — die Start-Synchronisation liess folderId leer, wodurch der selectedMessage-Guard (folderId === messagesFolder) jede Mail verwarf; erst ein Ordnerwechsel+Zurueck half. Jetzt wird folderId beim Start mit dem UI-Ordner synchronisiert. SECURITY Code-Review: Path-Traversal bei Backup-Wiederherstellung und mbox-Import geschlossen (Pfadvalidierung), Stored-XSS beim Rendern roher Mail-HTML entschaerft (DOMPurify-Sanitizer), CORS-Layer entfernt (App laeuft same-origin), API-Key-Guard gehaertet (RELAY_TRUSTED_HOST_SUFFIX gegen Host-Spoofing), /info und /events nur noch per Key fuer interne Hosts, db_path aus /info entfernt, 40 unwrap→expect in Tone/Security. TEST/LINT: CI-Workflow (cargo test+clippy, svelte-check+tsc+vitest+build), 10 vorbestehende svelte-check-Typeerrors gefixt, A11y (Keyboard/ARIA) fuer Toolbar und Mail-Liste, Vitest-Coverage-Gate gruen, dead code entfernt. UI: Unterordner-Einrueckung -25%, Antworten/Loeschen-Buttons ohne Icons und gleich breit (min-width 100px). Built for Olares 1.12.6.
    v26.09.90: NEU Sofortiger Ordnerwechsel (Meta-only Liste + Server-Side-Cache — grosse Ordner laden in Millisekunden statt Sekunden). FIX IMAP-Session-Leak (Timeout/Join-Fehler loggen jetzt die Session sauber aus → kein Login-Limit mehr). FIX Sent-Ordner: gesendete Mails sind gelesen (is_read=1 + APPEND \Seen), flag_refresh schuetzt kuerzlich lokal gelesene Mails (30s-Cooldown). NEU Empfaenger-Anzeige (An:/CC:) in der Mail-Vorschau. NEU Reply-All-Rueckfrage (An alle / nur Absender) bei mehreren Empfaengern. NEU Batch gelesen/ungelesen (eine Anfrage fuer alle markierten). FIX Unterordner-Drag-Reihenfolge baum-basiert (innerhalb der eigenen Geschwister, persistiert). FIX Mobile Compose Toolbar-Buttons vertikal zentriert (45px, kein Padding-Overlauf). Sidebar: "AImighty Relay 3.0". Profilbild-Upload unterstuetzt SVG. Built for Olares 1.12.6.
    v26.09.89: Designguide-Konformitaet — Hanseatenblau/Gold-Palette (#caa960), keine Apple-Farben/SF-Fonts, Geist als Variable Fonts (100-900), keine dekorativen Schatten/Verlaeufe, Zustandsfarben an Guide-Palette, konformes App-Icon (Hanseatenblau + goldener Punkt). Built for Olares 1.12.6.
    v26.09.88: NEU Anhang-Vorschau — (1) "Öffnen" zeigt das Dokument jetzt in einem In-App-Overlay (Root-Cause vorher: Blob ohne MIME-Type + window.open im WebView-Kontext → leeres Fenster). Blob trägt jetzt den content_type, Overlay rendert PDFs/Bilder/Text im iframe/img, Download-Button im Overlay, Esc/Scrim schließt, revokeObjectURL beim Schließen. (2) Kontextmenü: "Speichern als…" → "Download" (Verhalten war bereits direkter Download; Label irreführend); saveAttachment nutzt jetzt ebenfalls den MIME-Type. (3) Mobile Compose: Button-Padding oben/unten 10px → 15px (height auto, min-height 45px — verhindert Label-Überlauf bei border-box), vertikale Zentrierung per Browser-Messung bestätigt (0px Abweichung zur Toolbar-Mitte). Built for Olares 1.12.6.
    v26.09.87: Mobile Compose: Fußzeilen-Toolbar korrigiert — Buttons 58px → 45px, Button-Padding oben/unten 10px, Toolbar-Padding 10px; vertikale Zentrierung per Browser-Messung verifiziert (Button-Mitte = Toolbar-Mitte, 0px Abweichung). Built for Olares 1.12.6.
    v26.09.86: NEU Markiert-Stern — (1) Suchfeld: Stern-Shortcut (Umriss=inaktiv, gefüllt=aktiv) filtert auf markierte E-Mails (is:flagged); die is:flagged-Suche war durch einen Parameter-Bug defekt (LIMIT ?3 mit 2 gebundenen Params → "Got 2, needed 3") und funktioniert jetzt (auch manuell tippbar, kombinierbar mit Text). (2) Markierte Mails zeigen den gleichen stilisierten Stern als Markierung (statt 🚩-Emoji), normale Schriftfarbe. (3) Mobile Compose: Fußzeilen-Toolbar um 33% erhöht (Touch-Ziele 44px → 58px, Padding 5→7px, Toolbar-Padding 8→10px). Built for Olares 1.12.6.
    v26.09.85: Fix — Soft-Fallback beim Löschen findet jetzt den echten Provider-Papierkorb (GMX: "Gelöscht", Gmail: "[Gmail]/Papierkorb") statt hart "Trash" zu verwenden (existiert auf dem Server nicht → Delete-Queue-Einträge schlugen fehl). Kein Trash-Ordner auf dem Server: harter Delete als letzte Option. Built for Olares 1.12.6.
    v26.09.84: Fixes — (1) Löschen → IMAP: Provider-Löschung wurde nie in die Lösch-Queue geschrieben (SELECT id mit JOIN folders = "ambiguous column name: id" → message_id unauflösbar; enqueue-Fehler still verschluckt) — Mails blieben auf dem Server. Jetzt: m.id qualifiziert, Queries korrekt gebunden, enqueue-Fehler werden geloggt, Log erst nach erfolgreichem Queue-Eintrag. (2) Markieren: is_flagged-SQL hatte kollidierende Parameter (? = ?1) — das Flag wurde nie in der DB geschrieben. (3) Unterordner standardmäßig zugeklappt (erst per Doppelklick aufklappen). (4) Mobile Compose: Fußzeile (Generieren/Formatieren/Senden) jetzt fixiert wie der Header — nicht mehr nur sticky im Scroll-Body. (5) MacOS: Cmd+, (Einstellungen) + Olares-Desktop-postMessage-Navigation führen jetzt zu /settings. Built for Olares 1.12.6.
    v26.09.82: Fix — vertauschte E-Mail-Inhalte zwischen Ordnern (UID-Kollisionen bei lokalen Ordnern): Frontend-Store übernimmt keine Bodies mehr über Ordnerwechsel, ausgewählte Nachricht folder-sicher aufgelöst. Fix — leere E-Mail-Inhalte: Body-Backfill per EML-Reparse (offline) + On-demand-Body aus dem Archiv für lokale Ordner. Built for Olares 1.12.6.
    v26.09.81: Fix — E-Mails ohne HTML-Teil verlieren nicht mehr die Zeilenumbrüche (Fließtext). Alte betroffene Nachrichten werden beim Start automatisch bereinigt. Built for Olares 1.12.6.
  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
envs: []
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  relay: 1
