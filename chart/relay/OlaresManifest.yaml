olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.9.120
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: internal
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.9.120
  upgradeDescription: |
    v26.9.120: Dringlich-Kennzeichnung + Mobile-Views + CC/Bcc — (1) Dringliche Mails: neue rote Kennzeichnung (roter Balken + Unterlegung, wie bei Ungelesen) für Mails, die die KI als KRITISCH einstufte oder die manuell per Kontextmenü „Dringlich“ markiert wurden; der alte Prioritäts-Punkt wurde entfernt. (2) Markierungs-Stern in Gold. (3) Mobile Ansicht (Kontakte/Aufgaben/Kalender): Sidebar als Overlay mit Burger-Button; Detail-Pane im Kalender als Vollbild-Overlay. (4) CC/Bcc: Pillen-Eingabe wie bei „An“ (Kontakt-Vorschläge + Auto-Completion); CC wird jetzt im Entwurf gespeichert. (5) KI-Urgency: Dringlichkeit wird jetzt aus der Dringlichkeits-Zeile der KI-Zusammenfassung abgeleitet (statt Volltext-Suche) und der Betreff fließt in die Analyse ein. Built for Olares 1.12.6.
  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
envs: []
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  relay: 1
