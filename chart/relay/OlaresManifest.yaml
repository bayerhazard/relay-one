olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.10.8
  categories:
    - Applications
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: internal
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.10.8
  upgradeDescription: |
    v26.10.8: "Similar emails" in a mail's context menu shows, in the open folder, all mails from the same sender, from the same domain or with a similar subject; "Select all" then moves them to the trash, the archive or spam in one go, with "Undo" as always. A running folder refresh no longer replaces the results of a search.
    v26.10.7: Relay can be installed as an app in Chrome and Edge again: the browser now fetches the app manifest with your sign-in to the box, so it gets the manifest and not the login page. Open Relay at its own address, not inside the Olares desktop, and choose "Install" in the address bar.
    v26.10.6: The mail list is calmer: an unread mail has a dot, the open one a full coloured surface, urgent mail the word "Urgent" before the subject; the bar on the left is gone. Relay works as an installed app: it opens without a network, has a sharp icon on every home screen, offers "New email", "Calendar" and "Contacts" on its app icon and shows pictures in the install dialog. "Undo" brings deleted or moved mail back at once.
    v26.10.5: Folders sit in a fixed order: Drafts, Sent and Archive at the top, your own folders in between, Spam and the trash at the bottom. In Gmail accounts the "[Google Mail]" folder is gone and its system folders take these places; All Mail, Starred and Important are hidden and no longer fetched, as they only show mail kept elsewhere. Backspace deletes the open mail and opens the next one, so several can go one after the other; deleting for good no longer asks but offers "Undo" for five seconds. Shift with the arrow keys selects several mails at once.
    v26.10.4: The header now follows the columns below it. Next to the mail list the search sits exactly above the list, from the folder name to its last icon, and grows when the list is dragged wider; the five areas start above the open mail. The magnifier sits centred in the search field, and the app checks on every build that its icons on the home screen and in the browser tab show the right picture.
    v26.10.3: Relay now looks and works like the other AImighty apps. The five areas sit as icons in the header next to the search, the column holds folders, views and settings sections, and the profile at the top right leads to the settings. Dark mode follows the system. Buttons, dialogs, icons and colours come from the AImighty design system; deleting something for good always asks first, moving mail to the trash can be undone. The assistant opens from the shield at the bottom right. Above each mail a compact row of icons replies, forwards, archives, marks as spam, trashes, moves and flags, each with its name as a tooltip, and "New email" sits at the top of the column. Calendar and contacts now also connect to servers that use Basic sign-in, and new mail arrives reliably on quiet inboxes. Newsletters that offer it can be ended with "Unsubscribe" next to the sender. Several mails can be archived, moved to spam or trashed at once and taken back, and an optional "Clean up" area lists who writes to you most and lets you go through mail one by one.
    v26.10.2: Relay now defaults to the Olares Router. Chat, speech-to-text and text-to-speech are served automatically through the system models default-chat, default-stt and default-tts — no manual endpoint setup. A custom endpoint stays available per capability in Settings. Requires Olares 1.12.7+; older versions keep the manual configuration. Built for Olares 1.12.6.
    v26.10.1: Initial Release for AImighty

  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  # amd64 only: release.yml builds no arm64 image (Kai, 7.10.2026).
  supportArch:
    - amd64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
  appCommon: true
