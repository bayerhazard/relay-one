olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Selbst gehosteter E-Mail-Client — IMAP/SMTP mit KI-Unterstützung.
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.09.25
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: public
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.09.25
  fullDescription: |
    **Relay** — dein selbst gehosteter E-Mail-Client.
    IMAP/SMTP-Anbindung mit lokalem Cache und KI-Assistenz (Antworten, Zusammenfassungen, Prioritäten, Tonfall).
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
envs: []
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  relay: 1
