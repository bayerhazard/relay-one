olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.9.152
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: internal
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.9.152
  upgradeDescription: |
    v26.9.152: Fix — AI requests now send the JSON response format in the OpenAI-standard object form, so JSON-mode calls (follow-up suggestions, summaries, assistant) work with LiteLLM gateways that reject the bare string form. Built for Olares 1.12.6.
    v26.9.151: Meeting follow-ups — the Meetings module now reads the agreed next steps from each summary and suggests concrete actions (tasks, calendar events) as chips below the meeting. Accepting a chip opens the assistant with a ready-to-confirm card; nothing is created until you confirm, and executed suggestions are not offered again for that meeting. Built for Olares 1.12.6.
    v26.9.150: New Meetings area — Relay now reads the finished meeting summaries that Insilo exports into the shared app folder and shows them as a fifth module: list, full-text search, participants, tags and the complete Markdown summary, with live updates as soon as Insilo writes a new export. The assistant can search meetings and navigate to the module. Built for Olares 1.12.6.
    v26.9.149: AI-composed text in the compose window keeps its formatting again — greetings, paragraphs and the sign-off are cleanly separated by line breaks instead of collapsing into a single block. Suggested follow-ups (task, calendar event, reply) now remember which ones you already executed: once a suggestion is confirmed and carried out, it is no longer offered again for that mail — on this device, even across restarts. Both are visible in everyday use. Built for Olares 1.12.6.
    v26.9.147: Each account in the sidebar now shows a small unread badge next to its inbox, so you can see at a glance when new mail arrives at any of your accounts — not just the one you have open. The badge appears only when there is something to read and updates live during sync. Built for Olares 1.12.6.
    v26.9.146: First-time sync of a large mailbox is now dramatically faster — instead of taking days, the full history drains in hours. Relay fetches mail in large batches and polls aggressively until the mailbox is caught up, then settles back into the normal low-activity rhythm. No visible changes to other features. Built for Olares 1.12.6.
    v26.9.145: Mail follow-ups now appear instantly — suggested actions (task, calendar event, reply) are generated in the background as each inbox mail arrives and shown the moment you open the message, with a startup catch-up that fills in anything generated while the app was offline. No visible changes to other features. Built for Olares 1.12.6.
    v26.9.144: Internal database hardening — the local mail database now uses a versioned migration framework, so schema upgrades apply cleanly and reliably on every update without re-running legacy steps. No visible changes. Built for Olares 1.12.6.
    v26.9.142: Proactive mail follow-ups — the assistant reads each new mail and offers typed suggestions (task, calendar event, reply draft) as chips under the message. Accepting a chip opens the assistant with a ready-to-confirm card; nothing is written until you confirm. Mail body is clamped and treated as data only, so injected instructions never execute. Built for Olares 1.12.6.
  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
  appCommon: true
envs: []
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  relay: 1
