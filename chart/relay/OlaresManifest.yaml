olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.09.91
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: public
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.09.91
  upgradeDescription: |
    v26.09.91: FIX Mails nach Kaltstart nicht oeffenbar — die Start-Synchronisation liess folderId leer, wodurch der selectedMessage-Guard (folderId === messagesFolder) jede Mail verwarf; erst ein Ordnerwechsel+Zurueck half. Jetzt wird folderId beim Start mit dem UI-Ordner synchronisiert. SECURITY Code-Review: Path-Traversal bei Backup-Wiederherstellung und mbox-Import geschlossen (Pfadvalidierung), Stored-XSS beim Rendern roher Mail-HTML entschaerft (DOMPurify-Sanitizer), CORS-Layer entfernt (App laeuft same-origin), API-Key-Guard gehaertet (RELAY_TRUSTED_HOST_SUFFIX gegen Host-Spoofing), /info und /events nur noch per Key fuer interne Hosts, db_path aus /info entfernt, 40 unwrap→expect in Tone/Security. TEST/LINT: CI-Workflow (cargo test+clippy, svelte-check+tsc+vitest+build), 10 vorbestehende svelte-check-Typeerrors gefixt, A11y (Keyboard/ARIA) fuer Toolbar und Mail-Liste, Vitest-Coverage-Gate gruen, dead code entfernt. UI: Unterordner-Einrueckung -25%, Antworten/Loeschen-Buttons ohne Icons und gleich breit (min-width 100px). Built for Olares 1.12.6.
    v26.09.90: NEU Sofortiger Ordnerwechsel (Meta-only Liste + Server-Side-Cache — grosse Ordner laden in Millisekunden statt Sekunden). FIX IMAP-Session-Leak (Timeout/Join-Fehler loggen jetzt die Session sauber aus → kein Login-Limit mehr). FIX Sent-Ordner: gesendete Mails sind gelesen (is_read=1 + APPEND \Seen), flag_refresh schuetzt kuerzlich lokal gelesene Mails (30s-Cooldown). NEU Empfaenger-Anzeige (An:/CC:) in der Mail-Vorschau. NEU Reply-All-Rueckfrage (An alle / nur Absender) bei mehreren Empfaengern. NEU Batch gelesen/ungelesen (eine Anfrage fuer alle markierten). FIX Unterordner-Drag-Reihenfolge baum-basiert (innerhalb der eigenen Geschwister, persistiert). FIX Mobile Compose Toolbar-Buttons vertikal zentriert (45px, kein Padding-Overlauf). Sidebar: "AImighty Relay 3.0". Profilbild-Upload unterstuetzt SVG. Built for Olares 1.12.6.
    v26.09.89: Designguide-Konformitaet — Hanseatenblau/Gold-Palette (#caa960), keine Apple-Farben/SF-Fonts, Geist als Variable Fonts (100-900), keine dekorativen Schatten/Verlaeufe, Zustandsfarben an Guide-Palette, konformes App-Icon (Hanseatenblau + goldener Punkt). Built for Olares 1.12.6.
    v26.09.88: NEU Anhang-Vorschau — (1) "Öffnen" zeigt das Dokument jetzt in einem In-App-Overlay (Root-Cause vorher: Blob ohne MIME-Type + window.open im WebView-Kontext → leeres Fenster). Blob trägt jetzt den content_type, Overlay rendert PDFs/Bilder/Text im iframe/img, Download-Button im Overlay, Esc/Scrim schließt, revokeObjectURL beim Schließen. (2) Kontextmenü: "Speichern als…" → "Download" (Verhalten war bereits direkter Download; Label irreführend); saveAttachment nutzt jetzt ebenfalls den MIME-Type. (3) Mobile Compose: Button-Padding oben/unten 10px → 15px (height auto, min-height 45px — verhindert Label-Überlauf bei border-box), vertikale Zentrierung per Browser-Messung bestätigt (0px Abweichung zur Toolbar-Mitte). Built for Olares 1.12.6.
    v26.09.87: Mobile Compose: Fußzeilen-Toolbar korrigiert — Buttons 58px → 45px, Button-Padding oben/unten 10px, Toolbar-Padding 10px; vertikale Zentrierung per Browser-Messung verifiziert (Button-Mitte = Toolbar-Mitte, 0px Abweichung). Built for Olares 1.12.6.
    v26.09.86: NEU Markiert-Stern — (1) Suchfeld: Stern-Shortcut (Umriss=inaktiv, gefüllt=aktiv) filtert auf markierte E-Mails (is:flagged); die is:flagged-Suche war durch einen Parameter-Bug defekt (LIMIT ?3 mit 2 gebundenen Params → "Got 2, needed 3") und funktioniert jetzt (auch manuell tippbar, kombinierbar mit Text). (2) Markierte Mails zeigen den gleichen stilisierten Stern als Markierung (statt 🚩-Emoji), normale Schriftfarbe. (3) Mobile Compose: Fußzeilen-Toolbar um 33% erhöht (Touch-Ziele 44px → 58px, Padding 5→7px, Toolbar-Padding 8→10px). Built for Olares 1.12.6.
    v26.09.85: Fix — Soft-Fallback beim Löschen findet jetzt den echten Provider-Papierkorb (GMX: "Gelöscht", Gmail: "[Gmail]/Papierkorb") statt hart "Trash" zu verwenden (existiert auf dem Server nicht → Delete-Queue-Einträge schlugen fehl). Kein Trash-Ordner auf dem Server: harter Delete als letzte Option. Built for Olares 1.12.6.
    v26.09.84: Fixes — (1) Löschen → IMAP: Provider-Löschung wurde nie in die Lösch-Queue geschrieben (SELECT id mit JOIN folders = "ambiguous column name: id" → message_id unauflösbar; enqueue-Fehler still verschluckt) — Mails blieben auf dem Server. Jetzt: m.id qualifiziert, Queries korrekt gebunden, enqueue-Fehler werden geloggt, Log erst nach erfolgreichem Queue-Eintrag. (2) Markieren: is_flagged-SQL hatte kollidierende Parameter (? = ?1) — das Flag wurde nie in der DB geschrieben. (3) Unterordner standardmäßig zugeklappt (erst per Doppelklick aufklappen). (4) Mobile Compose: Fußzeile (Generieren/Formatieren/Senden) jetzt fixiert wie der Header — nicht mehr nur sticky im Scroll-Body. (5) MacOS: Cmd+, (Einstellungen) + Olares-Desktop-postMessage-Navigation führen jetzt zu /settings. Built for Olares 1.12.6.
    v26.09.82: Fix — vertauschte E-Mail-Inhalte zwischen Ordnern (UID-Kollisionen bei lokalen Ordnern): Frontend-Store übernimmt keine Bodies mehr über Ordnerwechsel, ausgewählte Nachricht folder-sicher aufgelöst. Fix — leere E-Mail-Inhalte: Body-Backfill per EML-Reparse (offline) + On-demand-Body aus dem Archiv für lokale Ordner. Built for Olares 1.12.6.
    v26.09.81: Fix — E-Mails ohne HTML-Teil verlieren nicht mehr die Zeilenumbrüche (Fließtext). Alte betroffene Nachrichten werden beim Start automatisch bereinigt. Built for Olares 1.12.6.
  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
envs: []
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
workloadReplicas:
  relay: 1
