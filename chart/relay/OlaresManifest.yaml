olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: relay
  appid: relay
  title: Relay
  description: Relay — the intelligent, local email client
  icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
  version: 26.9.171
  categories:
    - Utilities
entrances:
  - name: relay
    port: 3000
    host: relay
    title: Relay
    icon: https://raw.githubusercontent.com/bayerhazard/relay-one/main/icon.png
    openMethod: window
    authLevel: internal
    # Custom Route-ID "mail": NICHT im Chart setzbar (Olares legt
    # spec.settings.customDomain.<entrance>.third_level_domain erst nach
    # Install im Application-CR an). Nach der Installation setzen:
    #   olares-cli settings apps domain set relay relay --third-level mail
    # → https://mail.aimighty.olares.de
spec:
  versionName: 26.9.171
  upgradeDescription: |
    v26.9.171: Insilo idea voice memos are now turned into tasks automatically. Relay reads the Idea memos from the Insilo app data and creates one compact task per idea (or enriches an existing task). Where the AI can already prepare something it does so and notes it in the task with a "Mighty:" line — mail drafts are prepared but never sent, calendar entries are created without inviting anyone. Failures are retried automatically; nothing is lost. Built for Olares 1.12.6.
    v26.9.169: Relay can adopt a mail account from Olares on first launch. If you have stored SMTP (and optionally IMAP, your name and company details) under Olares -> Settings -> Advanced -> System environment variables, the setup wizard offers "Adopt automatically" or "Set up manually", and the same import is available under Settings -> Email accounts. Every value is optional and missing fields can be filled in later; passwords never reach the browser. Built for Olares 1.12.6.
    v26.9.168: Overdue tasks keep the standard card background — only the red bar on the left edge marks them, matching the urgent marking in the mail list. Built for Olares 1.12.6.
    v26.9.167: Overdue tasks now use the same marking as an urgent mail — a red bar on the left edge with a subtle red wash — instead of a full red outline. Built for Olares 1.12.6.
    v26.9.166: The Tasks area now sits in the same shell as Mail, Contacts, Calendar and Meetings. The New and Refresh buttons moved back under the sidebar header (they had dropped to the bottom of the sidebar), the task counter now has the same styled divider row as the other modules, and the item titles use the same weight as the rest of the app. Recurrence and due-date markers are drawn as crisp inline icons instead of emoji, Escape now closes the task detail and sub-task dialogs from anywhere, and the label fields are fully localised. Built for Olares 1.12.6.
    v26.9.165: the Tasks sidebar now shows the New and Refresh buttons again — the button row was lost in the previous release, so only the styles were shipped and the buttons never appeared. v26.9.164: The Tasks area is now a full task manager. Quick Add captures a task with natural language in one line — dates like "Friday" or "3.10.", times, "p1"–"p4" priority, "#Project", "@label" and "/section" are recognised live while you type (press Q anywhere to focus it). The sidebar has focus views (Inbox, Today, Upcoming, All, Completed) plus your projects, which map to the CalDAV calendars, so everything stays usable in other calendar apps. Click a task for an inline detail panel with notes, date and time, priority, recurrence, project, section and labels; tasks can have sub-tasks and repeat (completing a recurring task creates its next occurrence). Completed tasks are hidden by default and can be shown with a toggle. All tasks sync over CalDAV. Built for Olares 1.12.6.
    v26.9.162: The lower sidebar block now looks identical in every area (Mail, Contacts, Calendar, Meetings, Tasks) — same module icons, same search field size and same divider height. In Contacts, Calendar, Meetings and Tasks the search field now matches Mail (slightly narrower and as tall as before). Built for Olares 1.12.6.
    v26.9.160: Fix — creating a task with a due date works again. The date picker sends a plain calendar date (YYYY-MM-DD) and the server rejected it as an invalid RFC 3339 timestamp, so the task was not saved; due dates are now accepted in both forms. Built for Olares 1.12.6.
    v26.9.159: The assistant can now draft completely new e-mails — ask it to write a mail and it navigates to Mail and opens the compose window with recipient, subject and dictated text pre-filled; sending stays manual. Previously the model could only reply to existing mails. Built for Olares 1.12.6.
    v26.9.158: Mobile fixes from the September 14 review — Escape now closes the mobile folder drawer (it previously stayed open and blocked the message list), menu buttons render as clean SVG icons instead of broken glyphs, the calendar toolbar wraps to two rows on phones and shows every control, the tasks header gets its own add button, the assistant button hides while a drawer or sheet is open, swipe action labels follow the app language, and contact display names are decoded from MIME encoding. Built for Olares 1.12.6.
    v26.9.157: Web-Frontend-Neuaufbau — 26.9.156 wurde wegen eines verhaltensbedingt
    veralteten Web-Build-Caches mit dem alten Frontend ausgeliefert. Fix: Build ohne
    Layer-Cache. Inhaltlich identisch zu 26.9.156. Built for Olares 1.12.6.
    v26.9.156: Cross-module GUI consistency wave — dark theme now applies on every module (deep links into meetings/calendar/contacts/tasks load dark correctly), context menus everywhere (calendar events, contacts, tasks, meetings via right-click), in-app confirmation dialogs instead of native windows, assistant answers render markdown, refresh buttons for calendar and contacts, Escape closes dialogs and context menus, meeting details no longer show the raw metadata header, and dates follow one app-wide format per language. Also: assistant can open a meeting (beta: tool wired). Built for Olares 1.12.6.
    v26.9.155: Meetings can now be removed from Relay — the meeting view has a Delete button that takes the meeting out of the list (it stays in Insilo, and new scans will not bring it back). The "Refresh" button now spans the full sidebar width like the task module, and the small status lines under it were removed. Built for Olares 1.12.6.
    v26.9.154: Meeting minutes can now be sent by mail — the meeting view has an "Email minutes" button that opens the compose window with the subject and the full summary pre-filled, ready for a recipient. Built for Olares 1.12.6.
    v26.9.153: The Meetings sidebar now matches the other modules exactly — same search field size and position, centered module icons, divider at the same height — and the "Scan now" button is renamed to "Refresh" and styled like the task sidebar buttons. Built for Olares 1.12.6.
    v26.9.152: Fix — AI requests now send the JSON response format in the OpenAI-standard object form, so JSON-mode calls (follow-up suggestions, summaries, assistant) work with LiteLLM gateways that reject the bare string form. Built for Olares 1.12.6.
    v26.9.151: Meeting follow-ups — the Meetings module now reads the agreed next steps from each summary and suggests concrete actions (tasks, calendar events) as chips below the meeting. Accepting a chip opens the assistant with a ready-to-confirm card; nothing is created until you confirm, and executed suggestions are not offered again for that meeting. Built for Olares 1.12.6.
    v26.9.150: New Meetings area — Relay now reads the finished meeting summaries that Insilo exports into the shared app folder and shows them as a fifth module: list, full-text search, participants, tags and the complete Markdown summary, with live updates as soon as Insilo writes a new export. The assistant can search meetings and navigate to the module. Built for Olares 1.12.6.
    v26.9.149: AI-composed text in the compose window keeps its formatting again — greetings, paragraphs and the sign-off are cleanly separated by line breaks instead of collapsing into a single block. Suggested follow-ups (task, calendar event, reply) now remember which ones you already executed: once a suggestion is confirmed and carried out, it is no longer offered again for that mail — on this device, even across restarts. Both are visible in everyday use. Built for Olares 1.12.6.
    v26.9.147: Each account in the sidebar now shows a small unread badge next to its inbox, so you can see at a glance when new mail arrives at any of your accounts — not just the one you have open. The badge appears only when there is something to read and updates live during sync. Built for Olares 1.12.6.
    v26.9.146: First-time sync of a large mailbox is now dramatically faster — instead of taking days, the full history drains in hours. Relay fetches mail in large batches and polls aggressively until the mailbox is caught up, then settles back into the normal low-activity rhythm. No visible changes to other features. Built for Olares 1.12.6.
    v26.9.145: Mail follow-ups now appear instantly — suggested actions (task, calendar event, reply) are generated in the background as each inbox mail arrives and shown the moment you open the message, with a startup catch-up that fills in anything generated while the app was offline. No visible changes to other features. Built for Olares 1.12.6.
    v26.9.144: Internal database hardening — the local mail database now uses a versioned migration framework, so schema upgrades apply cleanly and reliably on every update without re-running legacy steps. No visible changes. Built for Olares 1.12.6.
    v26.9.142: Proactive mail follow-ups — the assistant reads each new mail and offers typed suggestions (task, calendar event, reply draft) as chips under the message. Accepting a chip opens the assistant with a ready-to-confirm card; nothing is written until you confirm. Mail body is clamped and treated as data only, so injected instructions never execute. Built for Olares 1.12.6.
  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  supportArch:
    - amd64
    - arm64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
  appCommon: true
