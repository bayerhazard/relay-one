spec:
  versionName: 26.10.23
  upgradeDescription: |
    v26.10.23: On the phone the contact list stays as wide as the screen. One long address without a break used to push the whole page to the right — the buttons in the head, the switch "All · Address book · Other" and the letter index ran off the screen. Long names and addresses now end in "…", the full address is in the contact.
    v26.10.16: Calmer still. The list head keeps three signs: "Flagged only", "New email" and "More". Under "More" stand archive, trash, move, spam, read and flag for the marked mails, and refresh; the keys (E, Del, !) and the right-click menu stay. The open or selected mail is marked by a light blue face instead of the dark one. A click on the unread count at an account shows only its unread mails in the list ("Inbox – unread"); clicked again, or on the folder name, all of them. A mail read there stays until you leave the filter; "Unread only" is also under "More".
    v26.10.15: The mail view is calmer. The chosen folder is marked by bold text, without the gold bar. "New email" moves from the folder column into the list head as a letter with a plus. The signs follow their place, at most five in a row: above the open mail only what concerns its content (reply, forward, "More"); in the list head, while mails are marked, what acts on them (archive, trash, move, spam, and "More" for read and flag), otherwise refresh, "Flagged only" and "New email". The separate selection bar is gone; the right-click menu keeps everything.
    v26.10.14: "Unsubscribe" in "Clean up" works for every sender. Relay now notes for each mail whether it offers unsubscribing, so the button stands at every newsletter, not only at the 25 most frequent senders; "Subscriptions only" shows just those senders. Unsubscribing can clean up in the same step: tick "Afterwards move all emails to the trash" in the question, and "Undo" takes them back as always.
    v26.10.13: Relay follows what happens at your mail server, wherever it happened. A mail restored from the trash in Gmail or on the phone comes back in Relay; before, Relay kept it hidden for good. Relay's trash shows what the provider's trash holds, so mail restored or emptied there leaves it here too. Labels renamed or deleted in Gmail no longer stay behind in Relay, and a folder the server numbered anew is fetched again instead of mixing up its mails. A mail in two folders (the inbox and a label) gets its AI summary once.
    v26.10.12: Folders work at your mail server. A new folder is created there (on Gmail as a label); before, it existed only in Relay, and mail moved into it left the server. Renaming keeps the mails and folders below it and leaves no old copy behind in Relay, names with umlauts included; "Move to …" in a folder's menu moves it under another folder or to the top. Deleting a folder sends its mails to the trash (on Gmail only the label goes, the mails stay in the archive), and when the server refuses, Relay says so instead of clearing its copy. Trash and spam can be emptied from their menu, and a folder kept only in Relay can be created at the provider, with its mails.
    v26.10.11: Archiving, moving and starring keep your mail where it belongs on the mail server, on Gmail too. Archiving on Gmail takes a mail out of the inbox and leaves it in "All Mail", which Relay now shows as "Archive"; before, from the second archived mail on, Gmail put them in its trash. A folder Relay had seen empty (a spam folder, a new label) or that the server did not have yet no longer becomes "only in Relay": the server keeps the mail, and Relay makes the folder there if needed. After the update Relay brings mails this had taken off the server back, from its trash or from Relay's own copy. Star and "read" find the right mail right after a move and stay in their folder, and mail moved or archived elsewhere (in Gmail, on the phone) disappears from Relay at the next sync. Dragged into the trash, a mail goes into the provider's trash; archive, trash, sent, drafts and spam can no longer be renamed or deleted by mistake.
    v26.10.10: Deleting reaches your mail server reliably. Mail deleted in Relay goes into the provider's real trash (on Gmail into "Trash" instead of only being archived); deleting it for good from Relay's trash removes it there too, found by its Message-ID — before, it never reached the server. A delete still within its five seconds of "Undo" is sent when the tab closes, a restart no longer leaves mail marked for deletion on the server, and should the server refuse after five tries, the mail list says so and offers "Try again". The retry buttons for deletions in the settings work again.
    v26.10.9: The calendar fits on a phone: the month in compact days with a dot per event and the chosen day's events as a list below, the head in two short lines with "+" for a new event, refresh and import under "More"; the weekday row is slim on every screen. On iPhone, "Add to Home Screen" shows the Relay icon instead of an "R". The profile circle shows your initials even where the box sets no name. The mail search looks in the open folder, as every action works there — a hit from another folder could have hit the wrong mail. Gmail's empty "Chats" folder is hidden, so "[Google Mail]" no longer stays in the folder list, and mail rows with an AI summary have room below it again.
    v26.10.8: "Similar emails" in a mail's context menu shows, in the open folder, all mails from the same sender, from the same domain or with a similar subject; "Select all" then moves them to the trash, the archive or spam in one go, with "Undo" as always. A running folder refresh no longer replaces the results of a search.
    v26.10.7: Relay can be installed as an app in Chrome and Edge again: the browser now fetches the app manifest with your sign-in to the box, so it gets the manifest and not the login page. Open Relay at its own address, not inside the Olares desktop, and choose "Install" in the address bar.
    v26.10.6: The mail list is calmer: an unread mail has a dot, the open one a full coloured surface, urgent mail the word "Urgent" before the subject; the bar on the left is gone. Relay works as an installed app: it opens without a network, has a sharp icon on every home screen, offers "New email", "Calendar" and "Contacts" on its app icon and shows pictures in the install dialog. "Undo" brings deleted or moved mail back at once.
    v26.10.5: Folders sit in a fixed order: Drafts, Sent and Archive at the top, your own folders in between, Spam and the trash at the bottom. In Gmail accounts the "[Google Mail]" folder is gone and its system folders take these places; All Mail, Starred and Important are hidden and no longer fetched, as they only show mail kept elsewhere. Backspace deletes the open mail and opens the next one, so several can go one after the other; deleting for good no longer asks but offers "Undo" for five seconds. Shift with the arrow keys selects several mails at once.
    v26.10.4: The header now follows the columns below it. Next to the mail list the search sits exactly above the list, from the folder name to its last icon, and grows when the list is dragged wider; the five areas start above the open mail. The magnifier sits centred in the search field, and the app checks on every build that its icons on the home screen and in the browser tab show the right picture.
    v26.10.3: Relay now looks and works like the other AImighty apps. The five areas sit as icons in the header next to the search, the column holds folders, views and settings sections, and the profile at the top right leads to the settings. Dark mode follows the system. Buttons, dialogs, icons and colours come from the AImighty design system; deleting something for good always asks first, moving mail to the trash can be undone. The assistant opens from the shield at the bottom right. Above each mail a compact row of icons replies, forwards, archives, marks as spam, trashes, moves and flags, each with its name as a tooltip, and "New email" sits at the top of the column. Calendar and contacts now also connect to servers that use Basic sign-in, and new mail arrives reliably on quiet inboxes. Newsletters that offer it can be ended with "Unsubscribe" next to the sender. Several mails can be archived, moved to spam or trashed at once and taken back, and an optional "Clean up" area lists who writes to you most and lets you go through mail one by one.
    v26.10.2: Relay now defaults to the Olares Router. Chat, speech-to-text and text-to-speech are served automatically through the system models default-chat, default-stt and default-tts — no manual endpoint setup. A custom endpoint stays available per capability in Settings. Requires Olares 1.12.7+; older versions keep the manual configuration. Built for Olares 1.12.6.
    v26.10.1: Initial Release for AImighty

  fullDescription: |
    - **AI Email Generation** – quickly draft precise emails and replies in your individual tone. It learns automatically to adapt generated email texts for different recipient groups (work, private) and even for individual recipients.
    - **Voice-to-Mail** – voice input that automatically becomes a finished email. It recognizes recipients and subject lines to generate complete templates.
    - **AI Monitoring** – smart inbox analysis for critical content, phishing warnings, priority rating, and automatic summaries.
    - **Local & Secure** – full data sovereignty; emails and AI models remain exclusively local on your device.
  developer: bayerhazard
  website: https://github.com/bayerhazard/relay-one
  sourceCode: https://github.com/bayerhazard/relay-one
  locale:
    - de
  # amd64 only: release.yml builds no arm64 image (Kai, 7.10.2026).
  supportArch:
    - amd64
  requiredCpu: 0.5
  limitedCpu: 4
  requiredMemory: 1Gi
  limitedMemory: 8Gi
  requiredDisk: 10Gi
  limitedDisk: 200Gi
  runAsUser: true
permission:
  appData: true
  appCommon: true
