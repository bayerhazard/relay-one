apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: {{ .Values.workloads.relay.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      initContainers:
        - name: relay-data-chown
          image: "beclab/aboveos-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p {{ .Values.storage.mountPath }}
              chown -R 1000:1000 {{ .Values.storage.mountPath }}
              chmod -R 770 {{ .Values.storage.mountPath }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: relay-data
              mountPath: {{ .Values.storage.mountPath }}
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RELAY_BIND
              value: "0.0.0.0:3000"
            - name: RELAY_DATA_DIR
              value: "{{ .Values.storage.mountPath }}"
            - name: RELAY_WEB_DIR
              value: "/opt/relay/web"
            {{- if .Values.trustedHostSuffix }}
            - name: RELAY_TRUSTED_HOST_SUFFIX
              value: {{ .Values.trustedHostSuffix | quote }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: relay-data
              mountPath: {{ .Values.storage.mountPath }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.workloads.relay.requiredCpu | default "500m" }}
              memory: {{ .Values.workloads.relay.requiredMemory | default "1Gi" }}
            limits:
              cpu: {{ .Values.workloads.relay.limitedCpu | default "4" }}
              memory: {{ .Values.workloads.relay.limitedMemory | default "8Gi" }}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: relay-data
          hostPath:
            # Userverzeichnis: <userspace>/Data/relay — Mail-DB (index.db) + KI-Daten
            path: {{ .Values.userspace.appData }}/relay
            type: DirectoryOrCreate
