{{- /* app-service rendert mit den in der Application-CR gespeicherten Values;
       in späteren Releases neu hinzugekommene Keys fehlen dort → dict + default. */ -}}
{{- $ideas := .Values.insiloIdeas | default dict -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: {{ .Values.workloads.relay.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      initContainers:
        - name: relay-data-chown
          image: "beclab/aboveos-busybox:1.37.0"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p {{ .Values.storage.mountPath }}
              chown -R 1000:1000 {{ .Values.storage.mountPath }}
              chmod -R 770 {{ .Values.storage.mountPath }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: relay-data
              mountPath: {{ .Values.storage.mountPath }}
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RELAY_BIND
              value: "0.0.0.0:3000"
            - name: RELAY_DATA_DIR
              value: "{{ .Values.storage.mountPath }}"
            - name: RELAY_WEB_DIR
              value: "/opt/relay/web"
            # Insilo-Meeting-Summaries: read-only Cross-App-Drop (appCommon).
            # Fehlt das Verzeichnis (Insilo nicht installiert), bleibt der
            # Scanner stumm — 0 Meetings ist kein Fehler.
            - name: RELAY_INSILO_DIR
              value: "/data/insilo"
            - name: RELAY_INSILO_ENABLED
              value: {{ .Values.insilo.enabled | quote }}
            - name: RELAY_INSILO_SCAN_SECS
              value: {{ .Values.insilo.scanIntervalSec | quote }}
            # Insilo-Ideen (Sprachmemos vom Typ "Idee"): direkt aus dem
            # Insilo-appData gelesen (read-only), daraus werden Aufgaben.
            - name: RELAY_INSILO_IDEAS_ENABLED
              value: {{ if hasKey $ideas "enabled" }}{{ $ideas.enabled | quote }}{{ else }}"true"{{ end }}
            - name: RELAY_INSILO_IDEAS_DIR
              value: {{ $ideas.mountPath | default "/data/insilo-ideas" | quote }}
            - name: RELAY_INSILO_IDEAS_SCAN_SECS
              value: {{ $ideas.scanIntervalSec | default 120 | quote }}
            - name: RELAY_INSILO_IDEA_PREFIX
              value: {{ $ideas.ideaPrefix | default "Idea" | quote }}
            {{- if .Values.trustedHostSuffix }}
            - name: RELAY_TRUSTED_HOST_SUFFIX
              value: {{ .Values.trustedHostSuffix | quote }}
            {{- end }}
            # Olares user/system env → Relay (seeded at first launch; empty when
            # the user has not configured the matching Olares variable).
            {{- range $k := list
                "EMAIL" "USERNAME" "TIMEZONE"
                "FIRSTNAME" "LASTNAME"
                "COMPANY_NAME" "COMPANY_ADDRESS" "COMPANY_PHONE" "COMPANY_WEBSITE"
                "COMPANY_EMAIL" "COMPANY_VAT_ID" "COMPANY_REGISTER"
                "MAIL_ACCOUNT_NAME" "MAIL_SIGNATURE"
                "IMAP_SERVER" "IMAP_PORT" "IMAP_USERNAME" "IMAP_PASSWORD" "IMAP_SSL"
                "SMTP_SERVER" "SMTP_PORT" "SMTP_USERNAME" "SMTP_PASSWORD"
                "SMTP_FROM_ADDRESS" "SMTP_SECURITY_PROTOCOLS" "SMTP_USE_TLS"
                "SMTP_USE_SSL" "SMTP_ENABLED" }}
            - name: RELAY_OLARES_{{ $k }}
              value: {{ (index $.Values.olaresEnv (printf "RELAY_OLARES_%s" $k)) | quote }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: relay-data
              mountPath: {{ .Values.storage.mountPath }}
            - name: insilo-drop
              mountPath: /data/insilo
              readOnly: true
            - name: insilo-ideas
              mountPath: {{ $ideas.mountPath | default "/data/insilo-ideas" }}
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.workloads.relay.requiredCpu | default "500m" }}
              memory: {{ .Values.workloads.relay.requiredMemory | default "1Gi" }}
            limits:
              cpu: {{ .Values.workloads.relay.limitedCpu | default "4" }}
              memory: {{ .Values.workloads.relay.limitedMemory | default "8Gi" }}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: relay-data
          hostPath:
            # Userverzeichnis: <userspace>/Data/relay — Mail-DB (index.db) + KI-Daten
            path: {{ .Values.userspace.appData }}/relay
            type: DirectoryOrCreate
        - name: insilo-drop
          hostPath:
            # Geteilter appCommon-Ordner: Insilo schreibt Meeting-Summaries
            # nach <appCommon>/insilo-meetings, Relay liest read-only.
            path: {{ .Values.userspace.appCommon }}/insilo-meetings
            type: DirectoryOrCreate
        - name: insilo-ideas
          hostPath:
            # Insilo-appData: aus dem eigenen appData abgeleitet. Kein `dir`
            # (app-service rendert den Lint-Platzhalter als interface{} und
            # `dir` verlangt strikt string) — daher der ..-Trick.
            path: {{ .Values.userspace.appData }}/../insilo
            type: DirectoryOrCreate
