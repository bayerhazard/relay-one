apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayapp
spec:
  replicas: {{ .Values.workloads.relayapp.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relayapp
  template:
    metadata:
      labels:
        app: relayapp
    spec:
      enableServiceLinks: false
      containers:
        - name: relayapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RELAY_BIND
              value: "0.0.0.0:3000"
            - name: RELAY_DATA_DIR
              value: "{{ .Values.storage.mountPath }}"
            - name: RELAY_WEB_DIR
              value: "/opt/relay/web"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: relay-data
              mountPath: {{ .Values.storage.mountPath }}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.workloads.relayapp.requiredCpu | default "500m" }}
              memory: {{ .Values.workloads.relayapp.requiredMemory | default "1Gi" }}
            limits:
              cpu: {{ .Values.workloads.relayapp.limitedCpu | default "4" }}
              memory: {{ .Values.workloads.relayapp.limitedMemory | default "8Gi" }}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: relay-data
          hostPath:
            path: {{ .Values.userspace.appData }}/relayapp
            type: DirectoryOrCreate
